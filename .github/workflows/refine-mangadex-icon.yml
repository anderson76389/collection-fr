name: One-time high-resolution MangaDex logo update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-mangadex-icon.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refine-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install local PNG tools
        run: python3 -m pip install --quiet Pillow
      - name: Replace only the MangaDex PNG with the verified high-resolution mark
        run: python3 .github/scripts/refine_mangadex_icon.py
      - name: Verify all 30 extension logos and densities
        run: python3 .github/scripts/verify_catalog_integrity.py
      - name: Commit the pinned image and five mipmaps
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source-logos/mangadex-icon.png assets/source-logos/logo-audit.json assets/source-logos/icon-sources.json src/all/mangadex/res
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "assets(mangadex): replace upscaled icon with verified high-resolution logo"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger release build and validation for the new icon
        if: ${{ steps.publish.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-and-publish.yml --ref main
          gh workflow run validate-manga-sources.yml --ref main
