name: Update Collection FR Mihon index

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-collection-fr-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Refresh curated index from Keiyoushi
        run: python build_index.py

      - name: Commit index changes
        run: |
          if git diff --quiet -- index.json repo.json; then
            echo "The curated extension index is already current."
            exit 0
          fi
          git config user.name "collection-fr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.json repo.json
          git commit -m "Update curated Mihon extension index"
          git push
