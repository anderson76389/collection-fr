name: Nettoyage unique des archives obsoletes
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-obsolete-archives.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Supprimer uniquement les APK et JAR des anciennes extensions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const obsolete = new Set(["bdplus","comix","coomer","elitebabes","flixnetcoffeemanga","hhentai","histoiredhentai","japscan","lunar-manga","lunaranime","mangabuddy","mangadot","mangadotnet","mangafire","manhwaweb","phenixscans","scanhentaimenu","sushiscanfr","tappytoon","webnovel","x-manga"]);
            const { owner, repo } = context.repo;
            const indexContent = await github.rest.repos.getContent({owner, repo, path: 'index.json', ref: 'repo'});
            const indexText = Buffer.from(indexContent.data.content, 'base64').toString('utf8');
            const published = JSON.parse(indexText).extensionList.extensions;
            if (published.length !== 30) throw new Error('Unexpected extension count: ' + published.length);
            const activePackages = new Set(published.map(x => x.packageName.split('.').at(-1).toLowerCase()));
            for (const slug of obsolete) { if (activePackages.has(slug)) throw new Error('Cannot remove active extension: ' + slug); }
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const selected = [];
            let preserved = 0;
            for (const release of releases) {
              for (const asset of release.assets) {
                const match = asset.name.match(/^tachiyomi-(?:[a-z]{2,3}|all)\.(.+?)-v[\d.]+\.(apk|jar)$/i) || asset.name.match(/^MAKOFF-(.+?)-v[\d.]+\.apk$/i);
                if (!match) { preserved++; continue; }
                if (obsolete.has(match[1].toLowerCase())) selected.push({id: asset.id, name: asset.name, tag: release.tag_name});
                else preserved++;
              }
            }
            if (selected.length < 500 || selected.length > 650) throw new Error('Unexpected deletion count: ' + selected.length);
            core.info(`Found ${selected.length} obsolete archive assets in ${releases.length} releases. Preserving ${preserved} others.`);
            let removedCount = 0;
            for (const asset of selected) {
              let done = false;
              for (let attempt = 1; attempt <= 5 && !done; attempt++) {
                try {
                  await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: asset.id});
                  done = true;
                  removedCount++;
                } catch (error) {
                  if (error.status === 404) { done = true; break; }
                  if (attempt === 5) throw error;
                  await new Promise(resolve => setTimeout(resolve, attempt * 1500));
                }
              }
              if (removedCount % 50 === 0 && removedCount) core.info(`Deleted ${removedCount}/${selected.length}`);
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            core.info(`Finished: removed ${removedCount} obsolete APK/JAR assets; ${preserved} retained.`);
