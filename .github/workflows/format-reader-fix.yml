name: Format reader fix on its isolated branch
on:
  push:
    branches: [fix/raijin-aniverse-20261020]
    paths: ['.github/workflows/format-reader-fix.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/raijin-aniverse-20261020
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Format only the three touched modules
        run: |
          ./gradlew --no-daemon :src:fr:raijinscans:spotlessApply :src:fr:japscan:spotlessApply :lib-multisrc:pam:spotlessApply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fr/raijinscans src/fr/japscan lib-multisrc/pam
          if ! git diff --cached --quiet; then
            git commit -m "Format reader session compatibility changes"
            git push origin HEAD:fix/raijin-aniverse-20261020
          fi
