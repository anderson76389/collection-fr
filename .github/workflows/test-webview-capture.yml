name: Test native WebView capture
on:
  pull_request:
    paths:
      - "lib/webviewcapture/**"
      - ".github/workflows/test-webview-capture.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android surface-copy tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :lib:webviewcapture:connectedDebugAndroidTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-capture-tests
          path: lib/webviewcapture/build/reports/androidTests/
