name: Probe source site endpoints
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-source-sites.yml'
      - '.github/scripts/probe_scanmanga.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public chapter-link markup
        run: python .github/scripts/probe_scanmanga.py
