name: Probe source site endpoints
on:
  push:
    branches: [main, fix/reader-20261004]
    paths:
      - '.github/workflows/probe-source-sites.yml'
      - '.github/scripts/probe_scanmanga.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare desktop and mobile reader responses
        run: python .github/scripts/probe_scanmanga.py
      - name: Preserve public response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanmanga-reader-responses
          path: scanmanga-probe/
          retention-days: 14
