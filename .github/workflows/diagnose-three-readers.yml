name: Diagnose three readers in Mihon
on:
  push:
    branches: [fix/raijin-aniverse-20261020]
    paths:
      - '.github/workflows/diagnose-three-readers.yml'
      - '.github/scripts/diagnose_three_readers.py'
permissions:
  contents: read
jobs:
  mihon:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the published APKs in Mihon 0.21.2
        env:
          SOURCE_AUDIT_LIMIT: "3"
          SOURCE_AUDIT_ONLY: "raijinscans,japscan,softepsilonscan"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disk-size: 6000M
          disable-animations: true
          script: python .github/scripts/diagnose_three_readers.py
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-readers-mihon-evidence
          path: |
            android-audit/*.xml
            android-audit/*.png
            android-audit/*.json
          retention-days: 7
