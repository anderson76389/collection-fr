name: Validate selected sources

on:
  push:
    branches: [main, fix/reader-20261004, fix/three-readers-20261006, add/four-apks-20261006, fix/four-fr-layout-20261006, fix/reader-runtime-20261007]
    paths:
      - "gradle/build-logic/**"
      - "src/fr/poseidonscans/**"
      - "src/fr/raijinscans/**"
      - "src/fr/animesama/**"
      - "src/fr/scanvf/**"
      - "src/fr/japscan/**"
      - "src/fr/blossomscans/**"
      - "src/fr/pantheonscan/**"
      - "src/fr/softepsilonscan/**"
      - "src/all/manhuarm/**"
      - "src/fr/webtoons/**"
      - "src/fr/mangadotnet/**"
      - "src/fr/mangadex/**"
      - "src/fr/lunaranime/**"
      - "src/fr/astralmanga/**"
      - "lib-multisrc/pam/**"
      - "src/fr/scanmanga/**"
      - "src/fr/saymanhwa/**"
      - ".github/workflows/validate-manga-sources.yml"
      - ".github/scripts/publish_index.py"
  pull_request:
    paths:
      - "gradle/build-logic/**"
      - "src/fr/poseidonscans/**"
      - "src/fr/raijinscans/**"
      - "src/fr/animesama/**"
      - "src/fr/scanvf/**"
      - "src/fr/japscan/**"
      - "src/fr/blossomscans/**"
      - "src/fr/pantheonscan/**"
      - "src/fr/softepsilonscan/**"
      - "src/all/manhuarm/**"
      - "src/fr/webtoons/**"
      - "src/fr/mangadotnet/**"
      - "src/fr/mangadex/**"
      - "src/fr/lunaranime/**"
      - "src/fr/astralmanga/**"
      - "lib-multisrc/pam/**"
      - "src/fr/scanmanga/**"
      - "src/fr/saymanhwa/**"
      - ".github/workflows/validate-manga-sources.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check publisher syntax
        run: python -m py_compile .github/scripts/publish_index.py

      - name: Lint the release variants
        run: ./gradlew --no-daemon :src:fr:saymanhwa:lintRelease :src:fr:webtoons:lintRelease :src:fr:mangadotnet:lintRelease :src:fr:mangadex:lintRelease :lib-multisrc:pam:lintRelease :src:all:manhuarm:lintRelease :src:fr:animesama:lintRelease :src:fr:astralmanga:lintRelease :src:fr:blossomscans:lintRelease :src:fr:dassouscan:lintRelease :src:fr:japscan:lintRelease :src:fr:mangascantrad:lintRelease :src:fr:mangasoriginesfr:lintRelease :src:fr:pantheonscan:lintRelease :src:fr:poseidonscans:lintRelease :src:fr:raijinscans:lintRelease :src:fr:rimuscans:lintRelease :src:fr:scanmanga:lintRelease :src:fr:scanreader:lintRelease :src:fr:scanvf:lintRelease :src:fr:softepsilonscan:lintRelease :src:fr:sushiscanfr:lintRelease
