name: Validate selected sources

on:
  push:
    branches: [main]
    paths:
      - "src/fr/japscan/**"
      - "src/fr/blossomscans/**"
      - "src/fr/pantheonscan/**"
      - "src/fr/softepsilonscan/**"
      - "src/all/manhuarm/**"
      - "src/fr/scanmanga/**"
      - ".github/workflows/validate-manga-sources.yml"
      - ".github/scripts/publish_index.py"
  pull_request:
    paths:
      - "src/fr/japscan/**"
      - "src/fr/blossomscans/**"
      - "src/fr/pantheonscan/**"
      - "src/fr/softepsilonscan/**"
      - "src/all/manhuarm/**"
      - "src/fr/scanmanga/**"
      - ".github/workflows/validate-manga-sources.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check publisher syntax
        run: python -m py_compile .github/scripts/publish_index.py

      - name: Lint the release variants
        run: ./gradlew --no-daemon :src:fr:japscan:lintRelease :src:fr:blossomscans:lintRelease :src:fr:pantheonscan:lintRelease :src:fr:softepsilonscan:lintRelease :src:all:manhuarm:lintRelease :src:fr:scanmanga:lintRelease
