name: Temporary X-Manga site structure check
on:
  push:
    branches: [fix/xmanga-new-site-20261024]
    paths:
      - '.github/workflows/_xmanga_probe_temp.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public X-Manga routes and DOM
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from html.parser import HTMLParser
          from collections import Counter
          import re
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[];self.images=[];self.scripts=[];self.tags=Counter();self.current=None
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs);self.tags[tag]+=1
                  if tag=='a' and d.get('href','').startswith(('/manga/','/read/','/catalogue/')):
                      self.current=[tag,d.get('href',''),d.get('class',''),'',[]]
                      self.links.append(self.current)
                  if tag=='img':
                      self.images.append({k:str(v)[:170] for k,v in d.items() if k in ('src','data-src','alt','class','loading')})
                  if tag=='script':
                      self.scripts.append(d.get('src','')[:170])
              def handle_data(self,txt):
                  if self.current and len(self.current[3])<120:
                      self.current[3]+=txt.strip()[:100]
              def handle_endtag(self,tag):
                  if tag=='a':self.current=None
          pages={'home':'/','catalogue':'/catalogue/','manga':'/manga/un-xy-dans-un-monde-de-xx/','read':'/read/b49de6d7-40f2-4d85-8547-0fec72a95f20/','old':'/manga/?m_orderby=views'}
          for label,path in pages.items():
              print('===',label,path,'===')
              try:
                  req=Request('https://x-manga.org'+path,headers={'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36','Accept':'text/html'})
                  with urlopen(req, timeout=18) as f:
                      s=f.read().decode('utf-8','replace')
                      print('STATUS',f.status,'FINAL',f.url,'HTML_BYTES',len(s))
                  h=Parser();h.feed(s)
                  print('TAGS',h.tags.most_common(20))
                  print('LINKS',h.links[:15]);print('IMAGES',h.images[:7]);print('SCRIPTS',h.scripts[-10:])
                  for token in ('/api/','__NEXT_DATA__','/read/','<h1','Chapitre','chapitre','/assets/','/manga/'):
                      print('TOKEN',token,'COUNT',s.count(token))
                  if label in ('read','manga','home'):
                      for pattern in ['<a ', '<img ', '/read/', '<script', '/api/']:
                          index=s.find(pattern)
                          print('SNIPPET',pattern,'AT',index,repr(s[max(0,index-130):index+290] if index>=0 else '')[:460])
              except Exception as ex:
                  print('ERROR',type(ex).__name__,str(ex)[:180])
          PY
