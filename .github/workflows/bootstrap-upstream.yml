name: Bootstrap independent source copy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy upstream source tree once
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f .collection-fr-upstream-snapshot ]]; then
            echo "The independent source snapshot is already present."
            exit 0
          fi

          upstream_dir="$RUNNER_TEMP/extensions-source"
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git "$upstream_dir"

          upstream_commit="$(git -C "$upstream_dir" rev-parse HEAD)"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            "$upstream_dir/" ./

          cat > .collection-fr-upstream-snapshot <<EOF
          Upstream: https://github.com/keiyoushi/extensions-source
          Commit: $upstream_commit
          Snapshot date: $(date -u +%Y-%m-%d)
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Vendor upstream extension source snapshot"
          git push origin HEAD:main
