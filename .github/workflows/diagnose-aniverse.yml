name: Diagnose Aniverse source
on:
  push:
    branches: [fix/raijin-aniverse-20261020]
    paths: ['.github/workflows/diagnose-aniverse.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public catalogue and reader schemas
        run: python .github/scripts/diagnose_aniverse.py
