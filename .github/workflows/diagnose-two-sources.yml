name: Diagnose CrunchyScan and Solaris HTML
on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-two-sources.yml"
      - ".github/scripts/diagnose_two_sources.py"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python .github/scripts/diagnose_two_sources.py
